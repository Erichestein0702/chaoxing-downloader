<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超星学习通资源下载器</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 资源下载器</h1>
      <p class="subtitle">超星学习通课程资源下载工具</p>
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="main">主页</button>
        <button class="tab-btn" data-tab="settings">设置</button>
      </nav>
    </header>

    <div id="tab-main" class="tab-content active">
      <div class="status-section">
        <div class="status-card">
          <div class="status-icon">🔍</div>
          <div class="status-info">
            <span class="status-label">当前页面</span>
            <span id="page-status" class="status-value">检测中...</span>
          </div>
        </div>

        <div class="status-card">
          <div class="status-icon">📊</div>
          <div class="status-info">
            <span class="status-label">发现资源</span>
            <span id="ppt-count" class="status-value">0 个</span>
          </div>
        </div>
      </div>

      <div class="action-section">
        <button id="scan-btn" class="primary-btn">🔎 扫描当前页面</button>
        <button id="download-all-btn" class="secondary-btn" disabled>⬇️ 批量下载全部</button>
      </div>

      <div class="ppt-list-section">
        <h3>📋 资源列表</h3>
        <div id="ppt-list" class="ppt-list">
          <div class="empty-state"><p>点击"扫描"按钮查找资源文件</p></div>
        </div>
      </div>

      <div class="progress-section" id="progress-section" style="display: none;">
        <h3>⏳ 下载进度</h3>
        <div class="progress-container">
          <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
          <span id="progress-text" class="progress-text">0%</span>
        </div>
        <div id="task-log" class="task-log"></div>
      </div>
    </div>

    <div id="tab-settings" class="tab-content">
      <h3>⚙️ 设置</h3>

      <div class="setting-item">
        <label for="setting-auto-scan">自动扫描</label>
        <select id="setting-auto-scan">
          <option value="off">关闭</option>
          <option value="on">开启（页面加载时自动扫描）</option>
        </select>
      </div>

      <div class="setting-item">
        <label for="setting-download-mode">默认下载方式</label>
        <select id="setting-download-mode">
          <option value="dialog">弹出保存对话框</option>
          <option value="silent">静默下载到 Downloads 文件夹</option>
        </select>
      </div>

      <div class="setting-item">
        <label for="setting-file-types">文件类型过滤</label>
        <div id="type-filters" class="type-filters">
          <label><input type="checkbox" value="ppt" checked> PPT</label>
          <label><input type="checkbox" value="pdf" checked> PDF</label>
          <label><input type="checkbox" value="mp4" checked> 视频</label>
          <label><input type="checkbox" value="doc" checked> 文档</label>
          <label><input type="checkbox" value="xls" checked> 表格</label>
          <label><input type="checkbox" value="zip" checked> 压缩包</label>
        </div>
      </div>

      <button id="save-settings-btn" class="primary-btn" style="width:100%;margin-top:12px;">💾 保存设置</button>
    </div>

    <footer>
      <p>v1.1.0 | 超星学习通资源下载器</p>
    </footer>
  </div>

  <script src="./popup.ts"></script>
</body>
</html>
